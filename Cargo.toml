[package]
name = "backscale"
version = "0.1.0"
edition = "2024"
description = "Serverless mesh VPN over WireGuard"
license = "MIT"

[dependencies]
atomic-write-file = "0.3.1"
blake3 = { version = "1.8.7", features = ["pure"] }
boringtun = { version = "0.7.1", default-features = false }
bt_bencode = "0.8.2"
card-backend = { version = "0.2", optional = true }
card-backend-pcsc = { version = "0.5", optional = true }
clap = { version = "4.6.8", features = ["derive", "env"] }
const-oid = { version = "0.9", optional = true }
crc32c = "0.6.9"
der = { version = "0.7", optional = true }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
humantime = "2.4.0"
if-addrs = "0.15.0"
ipnet = { version = "2.12.2", features = ["serde"] }
openpgp-card = { version = "0.7", optional = true }
p256 = "0.14.0"
p256-yk = { package = "p256", version = "0.13", optional = true, default-features = false, features = ["ecdsa"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.4"
rootcause = "0.13"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
sha1 = "0.11.0"
sha2 = "0.11"
# Not the defaults: snow's `std` feature pulls in ring.
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tun-rs = { version = "2.8.18", features = ["async"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
x509-cert = { version = "0.2", optional = true }
yubikey = { version = "0.8", features = ["untested"], optional = true }
zeroize = "1.9.2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }


[workspace]
members = ["crates/pcsc"]
exclude = ["vendor/boringtun"]

[patch.crates-io]
# git subtree of cloudflare/boringtun 0.7.1 with ring replaced by RustCrypto.
boringtun = { path = "vendor/boringtun" }
# Talks to pcscd directly instead of linking libpcsclite.
pcsc = { path = "crates/pcsc" }

[features]
default = []
piv = ["dep:yubikey", "dep:x509-cert", "dep:der", "dep:const-oid", "dep:p256-yk"]
openpgp = ["dep:openpgp-card", "dep:card-backend-pcsc", "dep:card-backend"]
hardware = ["piv", "openpgp"]

[package.metadata.deb]
maintainer = "Jonas Rudloff"
extended-description = "Serverless mesh VPN: WireGuard peers found over the BitTorrent DHT, membership defined by a signed network manifest."
section = "net"
license-file = ["LICENSE", "0"]
copyright = "2026, Jonas Rudloff"
features = ["hardware"]
depends = "$auto"
recommends = "pcscd"
maintainer-scripts = "debian/"
systemd-units = { enable = true, start = true }
assets = [
    ["target/release/backscale", "usr/bin/", "755"],
    ["debian/default", "etc/default/backscale", "644"],
]
